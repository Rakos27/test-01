name: Deploy Dealyva to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      AWIN_ACCESS_TOKEN: ${{ secrets.AWIN_ACCESS_TOKEN }}
      AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
      AWIN_MEMBERSHIP: joined
      AWIN_PRODUCT_FEED_URL: https://ui.awin.com/productdata-darwin-download/publisher/3010723/d8a8abda5eaf92a877519ad73848f74c/1/feed/F2605.csv.gz
      VITE_ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
      VITE_ADSENSE_SLOT_HOME_TOP: ${{ vars.ADSENSE_SLOT_HOME_TOP }}
      VITE_ADSENSE_SLOT_HOME_INLINE: ${{ vars.ADSENSE_SLOT_HOME_INLINE }}
      VITE_ADSENSE_SLOT_DETAIL: ${{ vars.ADSENSE_SLOT_DETAIL }}
      VITE_ENABLE_DEMO_OFFERS: ${{ vars.ENABLE_DEMO_OFFERS }}
      VITE_PUBLIC_SITE_URL: https://dealyva.me
      VITE_LEGAL_PUBLISHER_NAME: ${{ vars.LEGAL_PUBLISHER_NAME }}
      VITE_LEGAL_PUBLISHER_STATUS: ${{ vars.LEGAL_PUBLISHER_STATUS }}
      VITE_LEGAL_PUBLISHER_ADDRESS: ${{ vars.LEGAL_PUBLISHER_ADDRESS }}
      VITE_LEGAL_PUBLICATION_DIRECTOR: ${{ vars.LEGAL_PUBLICATION_DIRECTOR }}
      VITE_LEGAL_CONTACT_EMAIL: ${{ vars.LEGAL_CONTACT_EMAIL }}
      VITE_LEGAL_CONTACT_PHONE: ${{ vars.LEGAL_CONTACT_PHONE }}
      VITE_LEGAL_REGISTRATION_NUMBER: ${{ vars.LEGAL_REGISTRATION_NUMBER }}
      VITE_LEGAL_VAT_NUMBER: ${{ vars.LEGAL_VAT_NUMBER }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize and publish manually approved Awin offers
        if: ${{ env.AWIN_ACCESS_TOKEN != '' && env.AWIN_PUBLISHER_ID != '' }}
        run: npm run awin:sync

      - name: Audit Awin programmes
        if: ${{ env.AWIN_ACCESS_TOKEN != '' && env.AWIN_PUBLISHER_ID != '' }}
        run: npm run awin:audit

      - name: Archive Awin opportunity report
        if: ${{ env.AWIN_ACCESS_TOKEN != '' && env.AWIN_PUBLISHER_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: awin-opportunity-report
          path: data/awin-opportunity-report.json
          if-no-files-found: error

      - name: Build static site
        env:
          ROUTER_MODE: hash
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
